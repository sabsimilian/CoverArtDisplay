name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    if: github.ref != 'refs/tags/v0.2.0-windows-fix'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Builds a universal binary (arm64 + x86_64 in one bundle) so it
          # runs on both Apple Silicon and Intel Macs without needing to
          # publish two separate downloads.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # ubuntu-22.04, not ubuntu-latest — Tauri's own recommendation:
          # newer Ubuntu versions ship a libwebkit2gtk-4.1 ABI that isn't
          # guaranteed compatible with what an *older* end-user distro has
          # installed, so building on the oldest still-supported LTS keeps
          # the produced .deb/.AppImage broadly runnable.
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Spotify Cover Art ${{ github.ref_name }}"
          releaseBody: "Bug fixes and platform-specific improvements. Download the installer for your platform below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/**
            !src-tauri/target/**/bundle/**/*.map
          retention-days: 14

  replace-windows-release:
    if: github.ref == 'refs/tags/v0.2.0-windows-fix'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Replace v0.2.0 installer and remove superseded release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows NSIS installer was not produced." }

          gh release upload v0.2.0 $installer.FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release edit v0.2.0 --notes "Windows widget corner rendering fix. Download the Windows installer below."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release delete v0.2.1 --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/v0.2.0-windows-fix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
